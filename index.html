<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vera &amp; Attila – 2027. 06. 05.</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100dvh;
      background-color: #114729;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      max-width: 720px;
      width: 100%;
    }

    h1 {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: baseline;
      width: 100%;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-weight: 400;
      font-size: clamp(2.4rem, 8vw, 4.25rem);
      letter-spacing: 0.04em;
      line-height: 1.15;
    }

    h1 .left {
      text-align: right;
      padding-right: 0.32em;
    }

    h1 .amp {
      text-align: center;
    }

    h1 .right {
      text-align: left;
      padding-left: 0.32em;
    }

    .date-wrapper {
      display: grid;
      place-items: center;
      margin-top: 0.25rem;
      cursor: default;
      outline: none;
    }

    .date-wrapper span {
      grid-area: 1 / 1;
      font-size: clamp(1.1rem, 3.5vw, 1.4rem);
      font-weight: 300;
      transition: opacity 0.45s ease;
    }

    .date-text {
      letter-spacing: 0.22em;
      opacity: 1;
    }

    .countdown-text {
      letter-spacing: 0.1em;
      opacity: 0;
    }

    .date-wrapper:hover .date-text,
    .date-wrapper:focus .date-text,
    .date-wrapper.active .date-text {
      opacity: 0;
    }

    .date-wrapper:hover .countdown-text,
    .date-wrapper:focus .countdown-text,
    .date-wrapper.active .countdown-text {
      opacity: 1;
    }

    .location {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      font-size: clamp(1rem, 3vw, 1.2rem);
      font-weight: 400;
      letter-spacing: 0.14em;
      opacity: 0.92;
      margin-top: 0.25rem;
    }

    .location svg {
      width: 1.15em;
      height: 1.15em;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>
      <span class="left">Vera</span>
      <span class="amp">&amp;</span>
      <span class="right">Attila</span>
    </h1>

    <div class="date-wrapper" tabindex="0" id="dateWrapper">
      <span class="date-text">2027. 06. 05.</span>
      <span class="countdown-text" id="countdownText"></span>
    </div>

    <p class="location">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 21s-6.5-5.8-6.5-11.25a6.5 6.5 0 1 1 13 0C18.5 15.2 12 21 12 21z"/>
        <circle cx="12" cy="9.75" r="2.25"/>
      </svg>
      <span>Zebegény</span>
    </p>
  </main>

  <script>
    (function () {
      const weddingDate = new Date(2027, 5, 5); // 2027. június 5. (hónap 0-tól indexelve)
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diffDays = Math.ceil((weddingDate - today) / (1000 * 60 * 60 * 24));

      const countdownEl = document.getElementById('countdownText');
      if (diffDays > 0) {
        countdownEl.textContent = `még ${diffDays} nap van az esküvőig`;
      } else if (diffDays === 0) {
        countdownEl.textContent = 'ma van az esküvő!';
      } else {
        countdownEl.textContent = `${Math.abs(diffDays)} napja házasok`;
      }

      const wrapper = document.getElementById('dateWrapper');
      wrapper.addEventListener('click', function () {
        wrapper.classList.toggle('active');
      });
    })();
  </script>
</body>
</html>
