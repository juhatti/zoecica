<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vera &amp; Attila – 2027. 06. 05.</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100dvh;
      background-color: #114729;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-family: Georgia, "Times New Roman", Times, serif;
      font-weight: 400;
      font-size: clamp(2.4rem, 8vw, 4.25rem);
      letter-spacing: 0.04em;
      line-height: 1.15;
    }

    .date {
      font-size: clamp(1.1rem, 3.5vw, 1.4rem);
      font-weight: 300;
      letter-spacing: 0.22em;
      margin-top: 0.25rem;
    }

    .location {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      font-size: clamp(1rem, 3vw, 1.2rem);
      font-weight: 400;
      letter-spacing: 0.14em;
      opacity: 0.92;
      margin-top: 0.25rem;
    }

    .location svg {
      width: 1.15em;
      height: 1.15em;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Vera &amp; Attila</h1>
    <p class="date">2027. 06. 05.</p>
    <p class="location">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 21s-6.5-5.8-6.5-11.25a6.5 6.5 0 1 1 13 0C18.5 15.2 12 21 12 21z"/>
        <circle cx="12" cy="9.75" r="2.25"/>
      </svg>
      <span>Zebegény</span>
    </p>
  </main>
</body>
</html>
